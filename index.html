<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặn Máy Tính Sleep</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: 0.3s;
        }
        .off { background-color: #007bff; }
        .on { background-color: #dc3545; }
        #status {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        /* CSS cho bộ đếm thời gian */
        #timer {
            margin-top: 15px;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            font-family: monospace; /* Font monospace giúp các số không bị giật khi nhảy giây */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Trạng thái màn hình</h2>
    <button id="toggleBtn" class="off">Bật Chống Sleep</button>
    <div id="status" style="color: gray;">Đang tắt</div>
    <!-- Hiển thị thời gian -->
    <div id="timer">00:00:00</div>
</div>

<script>
    let wakeLock = null;
    let timerInterval = null;
    let startTime = 0;
    let elapsedTime = 0; // Lưu thời gian đã chạy khi bị tạm dừng (chuyển tab)
    let isIntendedActive = false; // Biến kiểm tra xem người dùng có chủ động bật không

    const toggleBtn = document.getElementById('toggleBtn');
    const statusDiv = document.getElementById('status');
    const timerDiv = document.getElementById('timer');

    // Hàm định dạng thời gian thành HH:MM:SS
    function formatTime(seconds) {
        const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    // Hàm cập nhật đồng hồ trên giao diện
    function updateTimer() {
        const now = Math.floor(Date.now() / 1000);
        const total = elapsedTime + (now - startTime);
        timerDiv.textContent = formatTime(total);
    }

    // Bắt đầu đếm thời gian
    function startTimer() {
        if (!timerInterval) {
            startTime = Math.floor(Date.now() / 1000);
            timerInterval = setInterval(updateTimer, 1000);
        }
    }

    // Tạm dừng đếm thời gian (dùng khi ẩn tab)
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            const now = Math.floor(Date.now() / 1000);
            elapsedTime += (now - startTime);
        }
    }

    // Reset bộ đếm về 0
    function resetTimer() {
        stopTimer();
        elapsedTime = 0;
        timerDiv.textContent = "00:00:00";
    }

    // Hàm kích hoạt chống sleep
    async function requestWakeLock() {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            
            // Cập nhật giao diện khi bật thành công
            statusDiv.textContent = "Đang giữ màn hình luôn sáng 💡";
            statusDiv.style.color = "green";
            toggleBtn.textContent = "Tắt Chống Sleep";
            toggleBtn.className = "on";

            startTimer(); // Bắt đầu đếm giờ

            // Lắng nghe nếu hệ thống tự động giải phóng (ví dụ khi ẩn tab)
            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                if (isIntendedActive) {
                    // Nếu người dùng không bấm tắt mà do hệ thống giải phóng (ẩn tab)
                    statusDiv.textContent = "Tạm dừng (Do ẩn Tab)";
                    statusDiv.style.color = "orange";
                    stopTimer(); // Tạm dừng đếm giờ
                }
            });

        } catch (err) {
            statusDiv.textContent = `Lỗi: ${err.message}`;
            statusDiv.style.color = "red";
            isIntendedActive = false;
            resetTimer();
        }
    }

    // Hàm tắt chống sleep
    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    // Đưa giao diện về trạng thái ban đầu
    function resetUI() {
        statusDiv.textContent = "Đang tắt";
        statusDiv.style.color = "gray";
        toggleBtn.textContent = "Bật Chống Sleep";
        toggleBtn.className = "off";
        resetTimer(); // Xóa bộ đếm
    }

    // Xử lý sự kiện khi nhấn nút
    toggleBtn.addEventListener('click', async () => {
        if (!('wakeLock' in navigator)) {
            statusDiv.textContent = "Trình duyệt của bạn không hỗ trợ tính năng này.";
            statusDiv.style.color = "red";
            return;
        }

        if (!isIntendedActive) {
            // Người dùng chủ động bật
            isIntendedActive = true;
            resetTimer(); 
            await requestWakeLock();
        } else {
            // Người dùng chủ động tắt
            isIntendedActive = false;
            releaseWakeLock();
            resetUI();
        }
    });

    // Tự động kích hoạt và chạy tiếp thời gian khi người dùng quay lại tab
    document.addEventListener('visibilitychange', async () => {
        if (isIntendedActive && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });
</script>

</body>
</html>
